name: VIE Gateway CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vie_gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Run independent security regressions
        run: python -m pytest -q tests/security --junitxml=security-results.xml
      - name: Type check
        run: python -m mypy src
      - name: Validate Compose YAML
        run: python -c "import yaml; yaml.safe_load(open('compose.yaml', encoding='utf-8'))"
      - name: Upload assessment test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence-${{ github.sha }}
          path: |
            vie_gateway/test-results.xml
            vie_gateway/security-results.xml
          if-no-files-found: error

  benchmark-smoke:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: vie_gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run benchmark smoke baseline
        run: python benchmarks/benchmark_gateway.py --iterations 50 --concurrency 5

  container:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: vie_gateway
    steps:
      - uses: actions/checkout@v4
      - name: Build gateway image
        run: docker build --tag madva-vie-gateway:ci .

  docker-integration:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: vie_gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build credential tool fixture
        run: docker build --tag madva-credential-tool:ci examples/credential-tool
      - name: Resolve immutable local image reference
        shell: bash
        run: echo "CREDENTIAL_TOOL_IMAGE=$(docker image inspect --format='{{index .RepoDigests 0}}' madva-credential-tool:ci)" >> "$GITHUB_ENV"
      - name: Run Docker credential isolation test
        run: python -m pytest -q tests/test_docker_integration.py

  upstream-integration:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: vie_gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Start gateway and demo MCP upstream
        run: docker compose -f compose.dev.yaml up -d --build mcp-upstream vie-gateway
      - name: Wait for gateway
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f compose.dev.yaml logs
          exit 1
      - name: Run upstream integration test
        env:
          MADVA_TEST_GATEWAY_URL: http://127.0.0.1:8000
        run: python -m pytest -q tests/test_docker_upstream.py
      - name: Stop integration stack
        if: always()
        run: docker compose -f compose.dev.yaml down --volumes

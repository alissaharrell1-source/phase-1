name: Security Scans

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  dependency-and-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate supply-chain policy
        run: python -m json.tool security/scan-policy.json > /dev/null
      - name: Validate release review record
        run: python security/validate_release_review.py --path security/release-review.json
      - name: Install application and audit tools
        run: |
          python -m pip install -r vie_gateway/requirements-dev.lock
          python -m pip install --no-deps -e ./vie_gateway
          python -m pip check
          python -m pip install pip-audit bandit[toml]
      - name: Audit Python dependencies
        run: pip-audit --format=json --output=pip-audit.json
      - name: Run Bandit static analysis
        run: bandit -r vie_gateway/src -f json -o bandit.json
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-static-security-${{ github.sha }}
          path: |
            pip-audit.json
            bandit.json
          if-no-files-found: error
          retention-days: 90

  release-review:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require approved release review
        run: python security/validate_release_review.py --path security/release-review.json --require-approved --release "${{ github.event.release.tag_name }}"

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build gateway image
        run: docker build --tag madva-vie-gateway:security vie_gateway
      - name: Scan gateway image
        # v0.35.0; immutable release commit verified against the upstream tag.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: madva-vie-gateway:security
          format: json
          output: trivy.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload container security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-security-${{ github.sha }}
          path: trivy.json
          if-no-files-found: error
          retention-days: 90

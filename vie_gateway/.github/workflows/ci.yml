name: VIE Gateway CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Type check
        run: python -m mypy src
      - name: Validate Compose YAML
        run: python -c "import yaml; yaml.safe_load(open('compose.yaml', encoding='utf-8'))"

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build gateway image
        run: docker build --tag madva-vie-gateway:ci .
